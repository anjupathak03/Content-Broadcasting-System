services:
  mysql:
    image: mysql:8.4
    container_name: content-broadcasting-system-mysql
    environment:
      MYSQL_DATABASE: content_broadcasting_system
      MYSQL_USER: content_user
      MYSQL_PASSWORD: content_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: content-broadcasting-system-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: content-broadcasting-system-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 4000
      PUBLIC_BASE_URL: http://localhost:4000
      DATABASE_URL: mysql://content_user:content_password@mysql:3306/content_broadcasting_system
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_EXPIRES_IN: 7d
      STORAGE_DRIVER: local
      UPLOAD_DIR: uploads/content
      MAX_FILE_SIZE_MB: 10
      DEFAULT_ROTATION_MINUTES: 5
      PUBLIC_RATE_LIMIT_PER_MINUTE: 60
      REDIS_URL: redis://redis:6379
      LIVE_CACHE_TTL_SECONDS: 15
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/app/uploads
    command: sh -c "npm run migrate && npm start"

volumes:
  mysql_data:
